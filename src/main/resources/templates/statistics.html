<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Statistics - ChatApp</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container" id="stats-root"
     th:data-email-url="@{/api/statistics/email}">
    <h4 class="mb-4">Your statistics</h4>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="stat-number" th:text="${stats.messagesSent}">0</div>
                <div class="text-muted">Messages sent</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="stat-number" th:text="${stats.messagesReceived}">0</div>
                <div class="text-muted">Messages received</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="stat-number" th:text="${stats.openChats}">0</div>
                <div class="text-muted">Open chats</div>
            </div>
        </div>
    </div>

    <button id="email-report-btn" class="btn btn-primary">
        📧 Email me this report
    </button>
    <span id="email-status" class="ms-3 small text-muted"></span>
</div>

<script th:src="@{/js/statistics.js}"></script>
</body>
</html>
