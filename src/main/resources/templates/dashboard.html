<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - ChatApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h4 class="mb-3">Hi, <span th:text="${currentUser.fullName}">User</span> 👋</h4>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">Open chats</div>
                <div class="list-group list-group-flush contact-list">
                    <p class="text-muted p-3 mb-0" th:if="${#lists.isEmpty(openChats)}">
                        No conversations yet - start one from the list on the right.
                    </p>
                    <a th:each="c : ${openChats}"
                       th:href="@{/chat/{id}(id=${c.id})}"
                       class="list-group-item list-group-item-action">
                        <strong th:text="${c.fullName}">Name</strong>
                        <div class="small text-muted" th:text="${c.email}">email</div>
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header">Start a new chat</div>
                <div class="list-group list-group-flush contact-list">
                    <p class="text-muted p-3 mb-0" th:if="${#lists.isEmpty(newContacts)}">
                        No other users to chat with yet. Invite a classmate to register!
                    </p>
                    <a th:each="c : ${newContacts}"
                       th:href="@{/chat/{id}(id=${c.id})}"
                       class="list-group-item list-group-item-action">
                        <strong th:text="${c.fullName}">Name</strong>
                        <div class="small text-muted" th:text="${c.email}">email</div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
