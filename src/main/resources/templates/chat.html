<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${'Chat with ' + peer.fullName}">Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Gli attributi data-* qui sotto sono il "ponte" tra Thymeleaf (lato server) e
     chat.js (lato client): il JavaScript li legge per sapere chi è l'utente
     corrente, chi è il peer e quali URL chiamare (cronologia, IA, WebSocket). -->
<div class="container"
     id="chat-root"
     th:data-current-user-id="${currentUser.id}"
     th:data-current-user-name="${currentUser.fullName}"
     th:data-peer-id="${peer.id}"
     th:data-peer-name="${peer.fullName}"
     th:data-history-url="@{/api/chat/history/{id}(id=${peer.id})}"
     th:data-suggest-url="@{/api/ai/suggest/{id}(id=${peer.id})}"
     th:data-ws-url="@{/ws}">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h5 class="mb-0">Chat with <span th:text="${peer.fullName}">Peer</span></h5>
        <a th:href="@{/dashboard}" class="btn btn-sm btn-outline-secondary">&larr; Back</a>
    </div>

    <div id="chat-window" class="mb-3"></div>

    <div id="ai-suggestion-box">
        <div class="small text-muted mb-1">🤖 AI suggestion (not saved unless you send it):</div>
        <div id="ai-suggestion-text" class="mb-2"></div>
        <button type="button" id="use-suggestion-btn" class="btn btn-sm btn-warning">Use this</button>
        <button type="button" id="dismiss-suggestion-btn" class="btn btn-sm btn-link">Dismiss</button>
    </div>

    <form id="send-form" class="d-flex gap-2">
        <button type="button" id="suggest-btn" class="btn btn-outline-secondary" title="Ask AI to suggest a reply">
            ✨ Suggest
        </button>
        <input type="text" id="message-input" class="form-control" placeholder="Type a message..." autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
    <div id="connection-status" class="small text-muted mt-2">Connecting...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:src="@{/js/chat.js}"></script>
</body>
</html>
