<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Log in - ChatApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="card auth-card shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title text-center mb-4">💬 Welcome back</h3>

            <div class="alert alert-success" th:if="${registered}">
                Account created successfully. You can log in now.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                You have been logged out.
            </div>
            <div class="alert alert-danger" th:if="${param.error}">
                Invalid email or password.
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>

            <p class="text-center mt-3 mb-0">
                No account yet? <a th:href="@{/register}">Register here</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
